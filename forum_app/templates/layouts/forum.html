{% extends 'layouts/main.html' %}

<!--===========LOADS=============-->
<!--===========BLOCKS=============-->
{% block title %}
    user
{% endblock title %}


{% block description %}
    description
{% endblock description %}
    

{% block keywords %}
    keywords
{% endblock keywords %}
    
<!--===========CONTENT=============-->

{% block content %}
<div class="p-10 bg-base-200 min-h-screen">
    {% block data %}{% endblock %}
    <div class="fab right-15 bottom-10"
    x-cloak
    x-data="{show:false}"
    x-show="show"
    x-transition
    @scroll.window="show = window.scrollY > 200">
        <button class="btn btn-lg btn-circle btn-primary" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })">
            <svg xmlns="http://www.w3.org/2000/svg" height="24" width="24" viewBox="0 0 640 640"><!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M342.6 105.4C330.1 92.9 309.8 92.9 297.3 105.4L137.3 265.4C124.8 277.9 124.8 298.2 137.3 310.7C149.8 323.2 170.1 323.2 182.6 310.7L320 173.3L457.4 310.6C469.9 323.1 490.2 323.1 502.7 310.6C515.2 298.1 515.2 277.8 502.7 265.3L342.7 105.3zM502.6 457.4L342.6 297.4C330.1 284.9 309.8 284.9 297.3 297.4L137.3 457.4C124.8 469.9 124.8 490.2 137.3 502.7C149.8 515.2 170.1 515.2 182.6 502.7L320 365.3L457.4 502.6C469.9 515.1 490.2 515.1 502.7 502.6C515.2 490.1 515.2 469.8 502.7 457.3z"/></svg>
        </button>
    </div>
</div>
{% comment %} <script>
   const fab = document.getElementById("fab");

    window.addEventListener("scroll", () => {
        if (window.scrollY > 0) {
            fab.classList.remove("hidden");
        } else {
            fab.classList.add("hidden");
        }
    });window.addEventListener("scroll", () => {
    fab.classList.toggle("hidden", window.scrollY < 200);
    });
</script> {% endcomment %}
{% endblock content %}
