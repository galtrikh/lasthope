{% extends "layouts/main.html" %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<div class="container mx-auto py-8 card bg-base-200 p-6 w-full md:w-1/2 lg:w-1/3 mt-10">
<h2 class="text-2xl font-bold mb-4">Восстановление пароля</h2>
<form method="post" class="fieldset">
  {% csrf_token %}
  <label class="label">Введите ваш email</label>
  <input type="email" name="email" class="input w-full mb-4" required value="{{ form.email.value|default_if_none:'' }}">
  <button type="submit" class="btn btn-primary">Отправить ссылку</button>
</form>
</div>

{% endblock content %}
